version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.dev
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
      # GeminiやGCPの環境変数は backend/.env に書く
      # ※ FIREBASE_AUTH_EMULATOR_HOST を設定すると本物のIDトークンを検証できなくなるので、エミュレータを使う時だけ足すこと

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
